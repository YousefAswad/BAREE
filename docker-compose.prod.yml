# Reference topology. In production use managed PostgreSQL 17 (+pgvector), managed Redis and S3-compatible storage.
x-app: &app
  image: ${BAREE_IMAGE:-baree:latest}
  env_file: .env
  restart: unless-stopped

services:
  app:        { <<: *app }
  nginx:
    image: nginx:1.27-alpine
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["8080:8080"]
    depends_on: [app]
    restart: unless-stopped
  horizon:    { <<: *app, command: ["php", "artisan", "horizon"] }     # queues: ai, media, files, exports, default
  scheduler:  { <<: *app, command: ["php", "artisan", "schedule:work"] }
  reverb:     { <<: *app, command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"], ports: ["8081:8081"] }
  clamav:     { image: "clamav/clamav:stable", restart: unless-stopped }
  gotenberg:  { image: "gotenberg/gotenberg:8", restart: unless-stopped, command: ["gotenberg", "--chromium-disable-javascript=true", "--api-timeout=60s"] }
